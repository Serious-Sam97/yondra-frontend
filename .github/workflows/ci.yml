name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  e2e:
    runs-on: ubuntu-latest
    # members.spec has a known pre-existing flake (timing-sensitive against the dev
    # server) — surface e2e results without blocking merges until it's stabilized.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npx playwright test
        env:
          # All network is mocked by the specs; these only need to exist so module
          # init code that reads them doesn't blow up.
          NEXT_PUBLIC_API: http://localhost:9999
          NEXT_PUBLIC_REVERB_KEY: ci-dummy
          NEXT_PUBLIC_REVERB_HOST: localhost
          NEXT_PUBLIC_REVERB_PORT: '8080'
